name: chart

on:
  push:
  pull_request:
  workflow_dispatch: {}

env:
  # Dummy values only: exercises templates/secrets.yaml without any real password.
  SECRETS: secrets.create=true,secrets.postgresPassword=x,secrets.nextcloudAdminPassword=x
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.5

      - name: helm lint
        run: |
          helm lint .
          helm lint . --set "$SECRETS"

      - name: helm template (every values combination)
        run: |
          mkdir -p /tmp/r
          helm template nextcloud . -n nextcloud                              > /tmp/r/production.yaml
          helm template nextcloud .                                           > /tmp/r/default-ns.yaml
          helm template nextcloud . -n nextcloud --set "$SECRETS"             > /tmp/r/secrets.yaml
          helm template nextcloud . -n nextcloud --set "$SECRETS" --set keepOnUninstall=false > /tmp/r/no-keep.yaml
          helm template nextcloud . -n nextcloud --set cron.enabled=false     > /tmp/r/minimal.yaml
          # The shape of a test install: own namespace, disposable storage, no NodePort clash.
          helm template nextcloud . -n ht-nextcloud \
            --set namespace.name=ht-nextcloud \
            --set nextcloud.persistence.html.storageClassName=longhorn-delete \
            --set nextcloud.persistence.data.storageClassName=longhorn-delete \
            --set db.persistence.storageClassName=longhorn-delete \
            --set redis.persistence.storageClassName=longhorn-delete \
            --set "$SECRETS"                                                  > /tmp/r/test-install.yaml
            # namespace.name defaults to "" so `-n` wins, which means the Namespace
            # object is never rendered by the combinations above (a release cannot own
            # the namespace it lives in). Render it explicitly, or the "every template
            # renders" guard below fails on templates/namespace.yaml.
            helm template nextcloud . -n release-ns --set namespace.create=true --set namespace.name=nextcloud-elsewhere  > /tmp/r/other-ns.yaml
            # cron.mode defaults to sidecar, so templates/cron-deployment.yaml is
            # correctly skipped by every combination above. Render the other mode too,
            # or the "every template renders" guard below fails on it.
            helm template nextcloud . -n nextcloud --set "$SECRETS" --set cron.mode=deployment > /tmp/r/cron-deployment-mode.yaml
          wc -l /tmp/r/*.yaml

      - name: Every template is tracked and renders
        run: |
          # An unanchored .gitignore pattern once kept a chart's own secrets.yaml out of git.
          for f in $(find templates -type f); do
            if git check-ignore --no-index -q "$f"; then echo "::error::$f is matched by .gitignore"; exit 1; fi
          done
          for f in $(find templates -type f -name '*.yaml'); do
            grep -q "^# Source: nextcloud/$f\$" /tmp/r/*.yaml || { echo "::error::$f never renders"; exit 1; }
          done
          echo "every template is tracked and renders"

      - name: kubeconform (schema validation)
        run: |
          curl -sSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
          kubeconform -strict -summary /tmp/r/*.yaml

      - name: Required secrets are enforced
        run: |
          if helm template nextcloud . --set secrets.create=true > /dev/null 2>&1; then
            echo "secrets.create=true rendered without any secret values"; exit 1
          fi
          # Each password on its own: drop it from the dummy set and expect its own required() message.
          for k in postgresPassword nextcloudAdminPassword; do
            set_without=$(echo "$SECRETS" | tr ',' '\n' | grep -v "^secrets.$k=" | paste -sd, -)
            if out=$(helm template nextcloud . -n nextcloud --set "$set_without" 2>&1); then
              echo "::error::secrets.$k is not enforced"; exit 1
            fi
            echo "$out" | grep -q "secrets.$k is required" || { echo "::error::wrong error for $k: $out"; exit 1; }
          done
          echo "required() guards fire"
          # The Secret must render; catches templates/secrets.yaml going missing from git.
          n=$(grep -c '^kind: Secret$' /tmp/r/secrets.yaml || true)
          [ "$n" -eq 1 ] || { echo "expected 1 Secret with secrets.create=true, got $n"; exit 1; }
          echo "secrets.create=true renders the Secret"

      - name: Keep policy on Namespace, PVCs and Secret
        run: |
          python3 - <<'EOF'
          import sys, yaml
          bad = []
          def objs(f): return [d for d in yaml.safe_load_all(open(f)) if d]
          for d in objs("/tmp/r/secrets.yaml") + objs("/tmp/r/default-ns.yaml"):
              if d["kind"] in ("Namespace", "PersistentVolumeClaim", "Secret"):
                  if (d["metadata"].get("annotations") or {}).get("helm.sh/resource-policy") != "keep":
                      bad.append(f"{d['kind']}/{d['metadata']['name']} has no keep policy")
          for d in objs("/tmp/r/production.yaml"):
              if d["kind"] == "Namespace" and d["metadata"]["name"] == "nextcloud":
                  bad.append("the release namespace must never be rendered")
          for d in objs("/tmp/r/no-keep.yaml"):
              if d["kind"] in ("Namespace", "PersistentVolumeClaim", "Secret"):
                  if "helm.sh/resource-policy" in (d["metadata"].get("annotations") or {}):
                      bad.append(f"{d['kind']}/{d['metadata']['name']} kept its keep policy with keepOnUninstall=false")
          sys.exit("\n".join(bad)) if bad else print("keep policy present; release namespace not rendered")
          EOF

      - name: No real secrets committed
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = []
          s = yaml.safe_load(open("values.yaml"))["secrets"]
          for k, v in s.items():
              if k in ("create", "nextcloudAdminUser"):
                  continue
              if v:
                  bad.append(f"values.yaml secrets.{k} must be empty")
          for f in ("/tmp/r/production.yaml", "/tmp/r/default-ns.yaml"):
              for d in yaml.safe_load_all(open(f)):
                  if d and d["kind"] == "Secret":
                      bad.append(f"{f} must not contain Secrets (secrets.create=false)")
          for d in yaml.safe_load_all(open("examples/secrets.example.yaml")):
              for k, v in ((d or {}).get("stringData") or {}).items():
                  if k not in ("NEXTCLOUD_ADMIN_USER",) and "REPLACE_ME" not in str(v):
                      bad.append(f"examples: {d['metadata']['name']}.{k} is not a placeholder")
          if "changeme" in open("values.yaml").read().lower():
              bad.append("values.yaml still contains a changeme-style default")
          sys.exit("\n".join(bad)) if bad else print("no secrets committed")
          EOF

      - name: "-n controls object placement (namespace footgun)"
        run: |
          # A values-file `namespace.name` that silently beats `-n` is how a
          # rehearsal once wrote Helm ownership annotations onto a live
          # production Deployment. Every object must land in the namespace
          # given by -n when namespace.name is left at its empty default.
          got=$(helm template t . -n SENTINEL --skip-tests  | grep "^  namespace:" | sort -u)
          if [ "$got" != "  namespace: SENTINEL" ]; then
            echo "::error::. ignores -n: $got"; exit 1
          fi
          echo "-n controls placement for every chart"

      - name: namespace.name must default to empty
        run: |
          python3 - <<'EOF'
          import sys, yaml, glob
          bad = []
          for f in glob.glob("**/values.yaml", recursive=True):
              v = yaml.safe_load(open(f)) or {}
              n = (v.get("namespace") or {})
              if isinstance(n, dict) and n.get("name"):
                  bad.append(f"{f}: namespace.name defaults to {n['name']!r}; it must be \"\" so -n wins")
          sys.exit("\n".join(bad)) if bad else print("namespace.name defaults are empty")
          EOF
