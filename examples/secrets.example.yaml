# -----------------------------------------------------------------------------
# Secret for Woow_k3s_nextcloud - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name. Copy this file OUTSIDE the repo, replace every REPLACE_ME
# value, then apply that copy:
#   kubectl --context woow-k3s apply -f /secure/path/secrets.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
  labels:
    app: nextcloud
type: Opaque
stringData:
  # Must equal db.image's POSTGRES_PASSWORD (the postgres/pgvector container
  # reads this same Secret via envFrom).
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  # Nextcloud admin account created on first boot.
  NEXTCLOUD_ADMIN_USER: "admin"
  NEXTCLOUD_ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
