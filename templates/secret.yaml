---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    app: nextcloud
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  NEXTCLOUD_ADMIN_USER: {{ .Values.secrets.nextcloudAdminUser | quote }}
  NEXTCLOUD_ADMIN_PASSWORD: {{ .Values.secrets.nextcloudAdminPassword | quote }}
