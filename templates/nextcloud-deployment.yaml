---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: {{ include "nextcloud.ns" . }}
  labels:
    app: nextcloud
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
      component: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
        component: app
    spec:
      # www-data in the nextcloud image is uid/gid 33. Freshly provisioned
      # PVCs on stricter CSI drivers (e.g. Longhorn) mount with a root-owned,
      # non-writable root directory; fsGroup makes it group-writable so the
      # container's entrypoint can create/write to nextcloud-html and
      # nextcloud-data. No-op on providers (e.g. local-path) that already
      # hand back a world-writable mount.
      securityContext:
        fsGroup: 33
      initContainers:
        # fsGroup only chgrps the freshly provisioned volume; it does not
        # strip the "other" read/execute bit some CSI drivers leave on the
        # mount root. Nextcloud refuses to serve any page ("Your data
        # directory is readable by other people") until that directory is
        # 0770 or stricter, so clear it once before the app container starts.
        - name: fix-data-perms
          image: "{{ .Values.nextcloud.image.repository }}:{{ .Values.nextcloud.image.tag }}"
          command: [sh, -c, "chmod 0770 /var/www/html/data"]
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html/data
      containers:
        - name: nextcloud
          image: "{{ .Values.nextcloud.image.repository }}:{{ .Values.nextcloud.image.tag }}"
          imagePullPolicy: {{ .Values.nextcloud.image.pullPolicy }}
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nextcloud-config
            - secretRef:
                name: nextcloud-secret
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
            - name: nextcloud-data
              mountPath: /var/www/html/data
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
{{- if and .Values.cron.enabled (eq .Values.cron.mode "sidecar") }}
        - name: cron
          image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
          imagePullPolicy: {{ .Values.cron.image.pullPolicy }}
          command:
            - /cron.sh
          envFrom:
            - configMapRef:
                name: nextcloud-config
            - secretRef:
                name: nextcloud-secret
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
            - name: nextcloud-data
              mountPath: /var/www/html/data
          resources:
            {{- toYaml .Values.cron.resources | nindent 12 }}
{{- end }}
      volumes:
        - name: nextcloud-html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data
