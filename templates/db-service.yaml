---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: {{ include "nextcloud.ns" . }}
  labels:
    app: nextcloud
    component: db
spec:
  type: {{ .Values.db.service.type }}
  ports:
    - port: {{ .Values.db.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: nextcloud
    component: db
