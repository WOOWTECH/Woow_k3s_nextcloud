---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "nextcloud.ns" . }}
  labels:
    app: nextcloud
    component: redis
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: nextcloud
    component: redis
