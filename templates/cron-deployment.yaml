{{- if .Values.cron.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron
  namespace: {{ include "nextcloud.ns" . }}
  labels:
    app: nextcloud
    component: cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
      component: cron
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
        component: cron
    spec:
      # See templates/nextcloud-deployment.yaml: same PVCs, same www-data uid/gid.
      securityContext:
        fsGroup: 33
      initContainers:
        - name: fix-data-perms
          image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
          command: [sh, -c, "chmod 0770 /var/www/html/data"]
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html/data
      containers:
        - name: cron
          image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
          imagePullPolicy: {{ .Values.cron.image.pullPolicy }}
          command:
            - /cron.sh
          envFrom:
            - configMapRef:
                name: nextcloud-config
            - secretRef:
                name: nextcloud-secret
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
            - name: nextcloud-data
              mountPath: /var/www/html/data
          resources:
            {{- toYaml .Values.cron.resources | nindent 12 }}
      volumes:
        - name: nextcloud-html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data
{{- end }}
