{{- /*
Secret, rendered only with secrets.create=true. By default it is created out
of band from examples/secrets.example.yaml and the chart never touches it, so
an upgrade cannot overwrite a real password with an empty one.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    app: nextcloud
  {{- include "nextcloud.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when secrets.create=true" $s.postgresPassword | quote }}
  NEXTCLOUD_ADMIN_USER: {{ $s.nextcloudAdminUser | quote }}
  NEXTCLOUD_ADMIN_PASSWORD: {{ required "secrets.nextcloudAdminPassword is required when secrets.create=true" $s.nextcloudAdminPassword | quote }}
{{- end }}
