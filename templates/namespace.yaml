{{- /*
A namespace equal to the release namespace is skipped: Helm keeps its
release record there, so it is created with --create-namespace instead and
can never be deleted by `helm uninstall`.
*/ -}}
{{- if and .Values.namespace.create (ne (include "nextcloud.ns" .) .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "nextcloud.ns" . }}
  labels:
    app: nextcloud
    managed-by: helm
  {{- include "nextcloud.keepAnnotations" . | nindent 2 }}
{{- end }}
